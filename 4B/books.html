<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Data</title>
</head>
<body>
    <h1>Book Information</h1>
    <div id="output"></div>

    <script>
        async function loadBooks() {
            const outputDiv = document.getElementById('output');
            try {
                const response = await fetch('books.json');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                const books = data.books;

                // (a) Title of the first book
                const firstTitle = document.createElement('p');
                firstTitle.textContent = `First book title: ${books[0].title}`;
                outputDiv.appendChild(firstTitle);

                // (b) Author of the second book
                const secondAuthor = document.createElement('p');
                secondAuthor.textContent = `Second book author: ${books[1].author}`;
                outputDiv.appendChild(secondAuthor);

                // (c) Genres grouped by book title
                books.forEach(book => {
                    const genreInfo = document.createElement('p');
                    genreInfo.textContent = `${book.title} — ${book.genres.join(', ')}`;
                    outputDiv.appendChild(genreInfo);
                });

            } catch (error) {
                const errorMessage = document.createElement('p');
                errorMessage.textContent = 'Error loading book data. Please make sure you are running this on a local server.';
                errorMessage.style.color = 'red';
                outputDiv.appendChild(errorMessage);
            }
        }

        loadBooks();
    </script>
</body>
</html>
